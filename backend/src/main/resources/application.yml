spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sanquim-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/sanquim?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:sanquim_app}
    password: ${DB_PASSWORD:change-me-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
sanquim:
  security:
    jwt-secret: ${JWT_SECRET_BASE64:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    cors-allowed-origins: ${SANQUIM_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    secretaria-email: ${BOOTSTRAP_SECRETARIA_EMAIL:}
    secretaria-name: ${BOOTSTRAP_SECRETARIA_NAME:}
    secretaria-password: ${BOOTSTRAP_SECRETARIA_PASSWORD:}
  demo:
    accounts-enabled: ${SANQUIM_DEMO_ACCOUNTS_ENABLED:false}
    aluno-email: ${SANQUIM_DEMO_ALUNO_EMAIL:}
    aluno-name: ${SANQUIM_DEMO_ALUNO_NAME:}
    aluno-password: ${SANQUIM_DEMO_ALUNO_PASSWORD:}
    professor-email: ${SANQUIM_DEMO_PROFESSOR_EMAIL:}
    professor-name: ${SANQUIM_DEMO_PROFESSOR_NAME:}
    professor-password: ${SANQUIM_DEMO_PROFESSOR_PASSWORD:}
    secretaria-email: ${SANQUIM_DEMO_SECRETARIA_EMAIL:}
    secretaria-name: ${SANQUIM_DEMO_SECRETARIA_NAME:}
    secretaria-password: ${SANQUIM_DEMO_SECRETARIA_PASSWORD:}
