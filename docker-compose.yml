services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sanquim}
      MYSQL_USER: ${MYSQL_USER:-sanquim_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - sanquim_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sanquim_mysql_data:
